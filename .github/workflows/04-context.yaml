name: context
# triggers
on: 
 push:
env:
 project: "roboshop"
 environment: "dev"
 component: "Catalogue"

jobs: # stages
  my-job: # stage
    runs-on: ubuntu-latest # agent, ubuntu-latest is github hosted runner
    steps:
    #this give us fulldata of event
      - name: Prinitng Env variables
        run: |
          echo "project: $project"
          echo "Component: $component"
      - name: Dump GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"

      - name: add variables to env
        run: |
          echo "course=github-actions" >> $GITHUB_ENV
          echo "duration=5hours" >> $GITHUB_ENV

      - name: access another step variables
        run: |
          echo "Course: $course"