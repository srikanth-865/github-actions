name: context
# triggers
on: 
 push:
env:
 project: "roboshop"
 environment: "dev"
 component: "Catalogue"

jobs: # stages
  first-job: # stage
    outputs:
     version: "${{steps.version.outputs.image-version}}" #we define and expose expilctly by adding this for our version here
     version: "${{steps.version.outputs.name}}"
    runs-on: ubuntu-latest # agent, ubuntu-latest is github hosted runner
    steps:
    #this give us fulldata of event
      - name: Prinitng Env variables
        run: |
          echo "project: $project"
          echo "Component: $component"
      - name: Dump GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"

      - name: add variables to env
        run: |
          echo "course=github-actions" >> $GITHUB_ENV
          echo "duration=5hours" >> $GITHUB_ENV

      - name: access another step variables
        run: |
          echo "Course: $course"

      - name: application version
        id: version #it for reference defining for the output value 1.0.0
        run: |
          echo "image-version=1.0.0" >> $GITHUB_OUTPUT
          echo "name=catalogue" >> $GITHUB_OUTPUT

  second-job:
    runs-on: ubuntu-latest # agent, ubuntu-latest is github hosted runner
    needs: first-job
    steps:
      - name: access variable from first-job outputs
        run: |
          echo "Image version: ${{ needs.first-job.outputs.version }}"
          echo "name is: ${{ needs.first-job.outputs.name }}"
